name: CD — Build & Push Images

on:
  push:
    branches: [main]
  workflow_dispatch:           # allow manual re-runs from the Actions UI

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Images are pushed to ghcr.io/<owner>/<repo>/backend, /frontend, /ml-service
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build + push ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    strategy:
      matrix:
        include:
          - service:    backend
            context:    ./backend
            dockerfile: ./backend/Dockerfile.prod
          - service:    ml-service
            context:    ./ml-service
            dockerfile: ./ml-service/Dockerfile.prod
          - service:    frontend
            context:    ./frontend
            dockerfile: ./frontend/Dockerfile.prod

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.service }}
          tags: |
            # Short commit SHA (e.g. sha-a1b2c3d)
            type=sha,prefix=sha-,format=short
            # Semantic version tags when a vX.Y.Z tag is pushed
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # latest on every main-branch push
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context:    ${{ matrix.context }}
          file:       ${{ matrix.dockerfile }}
          push:       true
          tags:       ${{ steps.meta.outputs.tags }}
          labels:     ${{ steps.meta.outputs.labels }}
          # Pass build args for frontend NEXT_PUBLIC_* variables
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://nexus.example.com' }}
            NEXT_PUBLIC_SUPERSET_URL=${{ vars.NEXT_PUBLIC_SUPERSET_URL || 'https://nexus.example.com/superset' }}
          # Layer cache from GHCR to speed up rebuilds
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}/${{ matrix.service }}:buildcache
          cache-to:   type=registry,ref=${{ env.IMAGE_BASE }}/${{ matrix.service }}:buildcache,mode=max

