name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]   # also run on direct pushes so the status is always visible

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend tests ──────────────────────────────────────────────────────────
  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     nexus
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB:       nexus_test
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ["5432:5432"]

      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: nexus
          MONGO_INITDB_ROOT_PASSWORD: ci_password
        ports: ["27017:27017"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL:          postgresql+psycopg://nexus:ci_password@localhost:5432/nexus_test
          MONGO_URL:             mongodb://nexus:ci_password@localhost:27017/?authSource=admin
          REDIS_URL:             redis://localhost:6379/0
          JWT_SECRET:            ci_test_secret_key_at_least_32_chars
          N8N_WEBHOOK_SECRET:    ci_internal_secret
          ANTHROPIC_API_KEY:     ""
          STORAGE_DIR:           /tmp/nexus_ci_storage
          LOG_LEVEL:             WARNING
        run: python -m pytest tests/ -x -q --tb=short

  # ── Frontend build ─────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend — next build + tsc
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL:      http://localhost:8000
          NEXT_PUBLIC_SUPERSET_URL: http://localhost:8088
        run: npm run build

  # ── Docker Compose validation ──────────────────────────────────────────────
  compose-validation:
    name: docker compose config
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate dev compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate prod compose
        run: docker compose -f docker-compose.prod.yml config --quiet
        env:
          # Supply dummy values so variable substitution doesn't error
          POSTGRES_USER:                nexus
          POSTGRES_PASSWORD:            dummy
          POSTGRES_DB:                  nexus
          MONGO_INITDB_ROOT_USERNAME:   nexus
          MONGO_INITDB_ROOT_PASSWORD:   dummy
          N8N_BASIC_AUTH_USER:          admin
          N8N_BASIC_AUTH_PASSWORD:      dummy
          N8N_WEBHOOK_SECRET:           dummy_secret
          JWT_SECRET:                   dummy_jwt_secret
          SUPERSET_SECRET_KEY:          dummy_superset_key
          SUPERSET_ADMIN_PASSWORD:      dummy
          ALLOWED_ORIGINS:              http://localhost:3000
          DOMAIN:                       localhost
          NEXT_PUBLIC_API_URL:          http://localhost:8000
          NEXT_PUBLIC_SUPERSET_URL:     http://localhost:8088
