<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#0d1520"/>
    </linearGradient>
    <radialGradient id="glow1" cx="70%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#00e5ff;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="40%">
      <stop offset="0%" style="stop-color:#7928ca;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#7928ca;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Grid lines subtle -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="#00e5ff" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="0" y1="629" x2="1200" y2="629" stroke="#00e5ff" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="1" y1="0" x2="1" y2="630" stroke="#00e5ff" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="1199" y1="0" x2="1199" y2="630" stroke="#00e5ff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Decorative rings -->
  <circle cx="950" cy="315" r="220" fill="none" stroke="#00e5ff" stroke-opacity="0.08" stroke-width="1"/>
  <circle cx="950" cy="315" r="170" fill="none" stroke="#00e5ff" stroke-opacity="0.06" stroke-width="1"/>
  <circle cx="950" cy="315" r="120" fill="none" stroke="#7928ca" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Dot accent -->
  <circle cx="950" cy="315" r="6" fill="#00e5ff" opacity="0.6"/>
  <circle cx="950" cy="315" r="14" fill="none" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="1"/>

  <!-- AV monogram top-left -->
  <text x="60" y="80" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="#00e5ff" letter-spacing="2">AV.</text>

  <!-- Tag line top right -->
  <text x="1140" y="60" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="end" letter-spacing="3">PORTFOLIO · 2025</text>

  <!-- Main name -->
  <text x="60" y="250" font-family="Arial Black, sans-serif" font-size="110" font-weight="900" fill="#ffffff" letter-spacing="-4" opacity="0.97">ABHI</text>
  <text x="60" y="370" font-family="Arial Black, sans-serif" font-size="110" font-weight="900" fill="#00e5ff" letter-spacing="-4">VASIREDDY</text>

  <!-- Divider line -->
  <rect x="60" y="400" width="80" height="3" fill="#00e5ff" opacity="0.7"/>

  <!-- Role tags -->
  <rect x="60" y="430" width="155" height="34" rx="17" fill="none" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="137" y="452" font-family="Arial, sans-serif" font-size="13" fill="#00e5ff" text-anchor="middle" letter-spacing="1">AI/ML Engineer</text>

  <rect x="228" y="430" width="145" height="34" rx="17" fill="none" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="300" y="452" font-family="Arial, sans-serif" font-size="13" fill="#00e5ff" text-anchor="middle" letter-spacing="1">LLM Engineer</text>

  <rect x="386" y="430" width="155" height="34" rx="17" fill="none" stroke="#7928ca" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="463" y="452" font-family="Arial, sans-serif" font-size="13" fill="#a78bfa" text-anchor="middle" letter-spacing="1">MLOps Engineer</text>

  <!-- Stack pills bottom -->
  <text x="60" y="535" font-family="Arial, sans-serif" font-size="13" fill="#333" letter-spacing="3">BUILT WITH</text>
  <text x="160" y="535" font-family="Arial, sans-serif" font-size="13" fill="#555" letter-spacing="2">React · Three.js · Vite · Framer Motion</text>

  <!-- URL -->
  <text x="60" y="590" font-family="Arial, sans-serif" font-size="15" fill="#00e5ff" opacity="0.7" letter-spacing="1">abhivasireddy13.github.io/my-3d-website</text>

  <!-- MIT tag -->
  <text x="1140" y="590" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="end" letter-spacing="2">MIT · Manipal</text>
</svg>
